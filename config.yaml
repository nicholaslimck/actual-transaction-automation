# Bank Transaction Automation - Configuration
# Copy to config.local.yaml and fill in your details

email:
  imap_server: "imap.gmail.com"
  imap_port: 993
  email: "your-email@gmail.com"
  app_password: ""  # Gmail app password

actual:
  server_url: ""       # e.g. http://192.168.1.100:5006
  password: ""         # Actual server password
  budget_id: ""        # Budget UUID from Settings > Advanced
  # encryption_password: ""  # Optional: encryption key if budget uses end-to-end encryption

# Each entry maps a bank email sender to an Actual account ID.
# Multiple entries can share the same bank or sender for multi-account support.
accounts:
  - name: "DBS Savings Plus"
    bank: dbs
    email_sender: "paylah.alert@dbs.com"
    actual_account_id: ""
  # Optional per-account routing filters (both optional; when both set they AND):
  #   subject_filter: regex matched against the email Subject (email-level).
  #   account_filter: last 4 digits of the card; only transactions whose
  #                   account_last4 matches are routed here (per-transaction).
  #                   Quote the value ("1234") so leading zeros survive YAML.
  #
  # Example: same sender + same subject, two physical cards → two accounts.
  # - name: "DBS Card 1234"
  #   bank: dbs
  #   email_sender: "ibanking.alert@dbs.com"
  #   subject_filter: "Card Transaction Alert"
  #   account_filter: "1234"
  #   actual_account_id: ""
  # - name: "DBS Card 5678"
  #   bank: dbs
  #   email_sender: "ibanking.alert@dbs.com"
  #   subject_filter: "Card Transaction Alert"
  #   account_filter: "5678"
  #   actual_account_id: ""
  # - name: "DBS Savings Plus"
  #   bank: dbs
  #   email_sender: "ibanking.alert@dbs.com"
  #   subject_filter: "Transaction Alerts"
  #   actual_account_id: ""
  - name: "Citi Cash Back Plus Credit"
    bank: citibank
    email_sender: "alerts@citibank.com.sg"
    actual_account_id: ""
  - name: "Trust Credit"
    bank: trust
    email_sender: "from_us@trustbank.sg"
    actual_account_id: ""
  - name: "Maribank Credit"
    bank: maribank
    email_sender: "notifications@maribank.sg"
    actual_account_id: ""
